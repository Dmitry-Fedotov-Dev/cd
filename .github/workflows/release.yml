name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write     # the release and the major tag
  id-token: write     # signs the provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          set -euo pipefail
          v=${GITHUB_REF_NAME#v}
          mkdir dist
          for arch in amd64 arm64; do
            d=$(mktemp -d)
            for b in cdd cdctl; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "$d/$b" ./cmd/$b
            done
            cp LICENSE README.md install.sh "$d/"
            tar -czf "dist/cd_${v}_linux_${arch}.tar.gz" -C "$d" .
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' > checksums.txt)
          cat dist/checksums.txt
      # who built what from which commit, signed by GitHub: gh attestation verify <file> -R Dmitry-Fedotov-Dev/cd
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          # move the major tag (v1) so `uses: …/cd@v1` follows compatible releases
          major=${GITHUB_REF_NAME%%.*}
          git tag -f "$major" && git push -f origin "refs/tags/$major"
